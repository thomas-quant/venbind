name: build

# Fork build-only workflow (thomas-quant/venbind): compiles the crate natively on
# each target's own runner and uploads the prebuilt .node that GoofCord consumes.
# Deliberately does NOT use the upstream devenv/nix recipe (it has bit-rotted —
# `devenv shell` bootstrap fails on current devenv). Standard napi-rs setup instead.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.settings.os }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      # uiohook-sys builds libuiohook via cmake and runs bindgen (needs libclang).
      - name: Install build deps (Linux)
        if: matrix.settings.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libdbus-1-dev
      - name: Install build deps (Windows)
        if: matrix.settings.os == 'windows'
        run: choco install -y cmake llvm
      - name: Build
        env:
          LIBCLANG_PATH: ${{ matrix.settings.os == 'windows' && 'C:\Program Files\LLVM\bin' || '' }}
        run: npx --yes @napi-rs/cli@2 build --release --target ${{ matrix.settings.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp index.node "dist/venbind-${{ matrix.settings.os }}-x86_64.node"
      - uses: actions/upload-artifact@v4
        with:
          name: venbind-${{ matrix.settings.os }}-x86_64
          path: dist/venbind-${{ matrix.settings.os }}-x86_64.node
